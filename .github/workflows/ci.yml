name: Mavdown CI & Test Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Bytecode Compilation Check
      run: |
        python -c "import compileall; res = compileall.compile_dir('.', force=True, quiet=1); exit(0 if res else 1)"

    - name: Run Unit Tests
      run: |
        python -m unittest discover tests
